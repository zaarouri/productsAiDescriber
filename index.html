<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor's Rage - ChatGPT Exam Incident</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="classroom">
            <div class="chalkboard">
                <div class="chalkboard-text">ACADEMIC INTEGRITY</div>
                <div class="chalkboard-subtext">Exam Results: SUSPICIOUS</div>
            </div>
            
            <div class="professor" id="professor">
                <div class="professor-head">
                    <div class="face">
                        <div class="eyes">
                            <div class="eye left-eye">
                                <div class="pupil"></div>
                            </div>
                            <div class="eye right-eye">
                                <div class="pupil"></div>
                            </div>
                        </div>
                        <div class="eyebrows">
                            <div class="eyebrow left-brow"></div>
                            <div class="eyebrow right-brow"></div>
                        </div>
                        <div class="mouth angry-mouth"></div>
                        <div class="steam steam-left"></div>
                        <div class="steam steam-right"></div>
                    </div>
                </div>
                <div class="professor-body">
                    <div class="tie"></div>
                </div>
                <div class="arms">
                    <div class="arm left-arm">
                        <div class="hand">
                            <div class="paper">📄</div>
                        </div>
                    </div>
                    <div class="arm right-arm"></div>
                </div>
            </div>

            <div class="speech-bubble" id="speechBubble">
                <p class="speech-text" id="speechText"></p>
            </div>

            <div class="students">
                <div class="student student-1">
                    <div class="student-head">😰</div>
                    <div class="student-body"></div>
                </div>
                <div class="student student-2">
                    <div class="student-head">😅</div>
                    <div class="student-body"></div>
                </div>
                <div class="student student-3">
                    <div class="student-head">😬</div>
                    <div class="student-body"></div>
                </div>
            </div>

            <div class="chatgpt-logo" id="chatgptLogo">
                <div class="logo-circle">
                    <span class="logo-text">ChatGPT</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="startBtn">Start Scene</button>
            <button class="btn" id="resetBtn">Reset</button>
        </div>

        <div class="story-text" id="storyText">
            Click "Start Scene" to witness the professor's reaction...
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
